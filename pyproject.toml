[project]
name = "eyes"
version = "0.1.0"
description = "Cheap structured vision instrument: Mirage perception + quantitative color + text reasoning"
requires-python = ">=3.11"
dependencies = [
    "cactus-compute",
    "pillow",
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyes"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
eyes = "eyes.cli:main"

[dependency-groups]
dev = [
    "pytest",
]
