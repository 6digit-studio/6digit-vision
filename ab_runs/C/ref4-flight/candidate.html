<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>flight status</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 400px;
    height: 155px;
    overflow: hidden;
    background: #2b2b2b;
  }
  body { position: relative; }

  .scene {
    position: absolute;
    inset: 0;
    filter: blur(1px);
  }

  /* ambient darkening / lighting around the black card */
  .ambient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(210px 100px at 50% 128%, rgba(0,0,0,0.46) 0%, rgba(0,0,0,0.28) 55%, rgba(0,0,0,0) 100%),
      radial-gradient(150px 130px at -2% 108%, rgba(0,0,0,0.20) 0%, rgba(0,0,0,0) 100%),
      radial-gradient(260px 120px at 50% -25%, rgba(0,0,0,0.23) 0%, rgba(0,0,0,0) 100%),
      linear-gradient(90deg, rgba(0,0,0,0.045) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.015) 100%);
  }

  .card {
    position: absolute;
    left: 16px;
    top: 17.4px;
    width: 350px;
    height: 120px;
    border-radius: 37.5px;
    background: #000;
    box-shadow: 0 2px 6px rgba(0,0,0,0.42);
  }

  .bar {
    position: absolute;
    left: 109.2px;
    top: 70.6px;
    width: 151.5px;
    height: 12.2px;
    border-radius: 6.1px;
    background: #63d4d8;
  }

  .plane {
    position: absolute;
    left: 0;
    top: 0;
    width: 400px;
    height: 155px;
    overflow: visible;
  }

  .txt {
    position: absolute;
    margin: 0;
    color: #fff;
    font-family: system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    white-space: pre;
    line-height: 1;
    font-kerning: normal;
  }
  .label { font-size: 16px; font-weight: 600; color: #f2f2f2; }
  .code  { font-size: 28px; font-weight: 400; color: #ffffff; }
  .time  { font-size: 16px; font-weight: 500; color: #f2f2f2; }
  .status{ font-size: 15.3px; font-weight: 500; color: #aecac8; }
</style>
</head>
<body>
 <div class="scene">
  <div class="ambient"></div>
  <div class="card"></div>

  <div class="bar"></div>
  <svg class="plane" viewBox="0 0 400 155" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="0.9" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#glow)" fill="#ffffff">
      <path d="M 252.0,73.9 C 251.2,75.0 251.2,77.9 252.0,79.0 L 266.6,79.3 L 279.3,76.4 L 266.6,73.4 Z"/>
      <path d="M 259.7,64.9 L 262.1,64.9 L 266.9,72.4 L 259.7,72.4 Z"/>
      <path d="M 259.7,87.9 L 262.1,87.9 L 266.9,80.4 L 259.7,80.4 Z"/>
      <path d="M 252.0,72.6 L 257.6,72.6 L 257.6,73.4 L 252.0,73.6 Z"/>
      <path d="M 252.0,80.4 L 257.6,80.4 L 257.6,79.6 L 252.0,79.4 Z"/>
    </g>
  </svg>

  <div class="txt label" style="left:44.5px; top:39px;">San Francisco</div>
  <div class="txt label" style="left:265px; top:39.5px;">Edmonton</div>
  <div class="txt code"  style="left:44.5px; top:64px;">SFO</div>
  <div class="txt code"  style="right:57px; top:63.5px;">YEG</div>
  <div class="txt time"  style="left:45px; top:96.5px;">9:59 PM</div>
  <div class="txt status" style="left:126.3px; top:97px;">Arrives in 20m</div>
  <div class="txt time"  style="right:57.5px; top:96.5px;">12:59 AM</div>
 </div>
</body>
</html>
