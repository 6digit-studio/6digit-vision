<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}

.calendar-container {
  background-color: #1a1a2e;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
  position: relative;
  width: 300px;
  max-width: 90vw;
}

.month-title {
  color: white;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 10px;
  text-align: center;
}

.date-info {
  color: #aaa;
  font-size: 14px;
  text-align: center;
  margin-bottom: 10px;
}

.weekdays {
  display: flex;
  justify-content: space-around;
  margin-bottom: 10px;
  font-weight: bold;
  color: #aaa;
}

.day {
  width: 30px;
  height: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 16px;
  color: white;
  border-radius: 50%;
  margin: 5px;
  cursor: pointer;
  background-color: #141c24;
  border: 1px solid #1c2434;
}

.day:hover {
  background-color: #333;
}

.selected {
  background-color: #4a86e8;
  color: white;
}

.footer {
  color: #aaa;
  font-size: 12px;
  text-align: center;
  margin-top: 20px;
}

.nav-buttons {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  gap: 10px;
}

.nav-button {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background-color: rgba(255, 255, 255, 0.1);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}
</style>
</head>
<body>
  <div class="calendar-container">
    <div class="month-title">Christmas Day</div>
    <div class="date-info">FRI · 25 DEC</div>
    <div class="weekdays">
      <div>MON</div>
      <div>TUE</div>
      <div>WED</div>
      <div>THU</div>
      <div>FRI</div>
      <div>SAT</div>
      <div>SUN</div>
    </div>
    <div class="grid">
      <div class="day">30</div>
      <div class="day">1</div>
      <div class="day">2</div>
      <div class="day">3</div>
      <div class="day">4</div>
      <div class="day">5</div>
      <div class="day">6</div>
      <div class="day">7</div>
      <div class="day">8</div>
      <div class="day">9</div>
      <div class="day">10</div>
      <div class="day">11</div>
      <div class="day">12</div>
      <div class="day">13</div>
      <div class="day">14</div>
      <div class="day">15</div>
      <div class="day">16</div>
      <div class="day">17</div>
      <div class="day">18</div>
      <div class="day">19</div>
      <div class="day">20</div>
      <div class="day">21</div>
      <div class="day">22</div>
      <div class="day">23</div>
      <div class="day">24</div>
      <div class="day selected">25</div>
      <div class="day">26</div>
      <div class="day">27</div>
      <div class="day">28</div>
      <div class="day">29</div>
      <div class="day">30</div>
      <div class="day">31</div>
      <div class="day">1</div>
      <div class="day">2</div>
      <div class="day">3</div>
    </div>
    <div class="footer">© 2023 Calendar App</div>
    <div class="nav-buttons">
      <div class="nav-button">❮</div>
      <div class="nav-button">❯</div>
    </div>
  </div>
</body>
</html>
