<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Sign In</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 300px;
            text-align: center;
        }
        .logo {
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #4493f8;
            border-radius: 4px;
            font-size: 16px;
            background-color: #1c1c1c;
            color: white;
        }
        .forgot-password {
            display: block;
            text-align: right;
            font-size: 14px;
            color: #4493f8;
            text-decoration: none;
            margin-top: 5px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .signup-link {
            margin-top: 15px;
            font-size: 14px;
            color: #4493f8;
            text-decoration: none;
        }
        .signup-link:hover {
            text-decoration: underline;
        }
        footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            color: #4493f8;
        }
        footer a {
            color: #4493f8;
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
