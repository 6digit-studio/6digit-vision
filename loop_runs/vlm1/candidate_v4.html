<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Sign In</title>
    <style>
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    background-color: #0d1117;
    color: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    position: relative;
}
.container {
    max-width: 400px;
    padding: 2rem;
    text-align: center;
}
.logo {
    width: 48px;
    height: 48px;
    margin: 0 auto 1.5rem;
}
h1 {
    font-size: 1.8rem;
    margin-bottom: 1.5rem;
}
.form-group {
    margin-bottom: 1rem;
}
label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
}
input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    border: 1px solid #4493f8;
    border-radius: 4px;
    background-color: #242426;
    color: #fff;
    transition: border-color 0.3s;
}
input[type="text"]:focus,
input[type="password"]:focus {
    outline: none;
    border-color: #4493f8;
}
.forgot-password {
    display: block;
    text-align: right;
    font-size: 0.9rem;
    color: #4493f8;
    text-decoration: none;
    margin-top: 0.5rem;
}
.btn {
    background-color: #238636;
    color: #fff;
    border: none;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s;
}
.btn:hover {
    background-color: #1e7a2b;
}
.new-account {
    display: block;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #4493f8;
    text-decoration: none;
}
.new-account:hover {
    text-decoration: underline;
}
footer {
    position: absolute;
    bottom: 1rem;
    left: 0;
    right: 0;
    padding: 1rem 0;
    background-color: #0d1117;
    text-align: center;
    font-size: 0.8rem;
    color: #aaa;
}
footer a {
    color: #4493f8;
    text-decoration: none;
    margin: 0 0.5rem;
}
footer a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12c0 1.1-.23 2.2-.6 3.1s-1.1 1.7-2 2.3c-1.1.7-2.4 1.2-3.8 1.4s-2.8-.1-4.2-.7c-1.4-.6-2.7-1.5-3.8-2.6s-1.9-2.3-2.5-3.7c-.6-1.4-.9-2.9-.9-4.5s.3-3.1 1-4.5c.7-1.4 1.7-2.6 3-3.5s2.7-1.5 4.5-1.8c1.8-.3 3.6-.1 5.3.5s3.2 1.6 4.5 3.1c1.3 1.5 2.2 3.2 2.7 5.1s.6 3.9.3 6.1z"/>
                <path d="M12 2c2.7 0 4.7 2 4.7 4.7s-2 4.7-4.7 4.7-4.7-2-4.7-4.7S9.3 2 12 2z"/>
            </svg>
        </div>
        <h1>Sign in to GitHub</h1>
        <div class="form-group">
            <label for="username">Username or email address</label>
            <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label for="password">Password</label>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Sign in</button>
        <p class="new-account">New to GitHub? <a href="#">Create an account</a></p>
    </div>
    <footer>
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Docs</a>
        <a href="#">Contact GitHub Support</a>
        <a href="#">Manage cookies</a>
        <a href="#">Do not share my personal information</a>
    </footer>
</body>
</html>
